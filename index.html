  <!-- Keep every local asset on the same build. This mirrors the original
       game's cache-busting rule and prevents an old action handler from being
       mixed with a newly rendered card after deployment. -->
  <link rel="stylesheet" href="styles.css?v=20260825-v33">
  <link rel="stylesheet" href="ielts.css?v=20260830-v43-keyword-readability">
  <script>
    (function () {
      function setRealVH() {
        var height = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        document.documentElement.style.setProperty('--vh100', height + 'px');
      }
      setRealVH();
      window.addEventListener('resize', setRealVH);
      window.addEventListener('orientationchange', function () { setTimeout(setRealVH, 50); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', setRealVH);

      window.isStandalonePWA = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

      // Ported from the WordArk build's proven fix: even once the layout numbers
      // are correct (html.is-standalone .screen{height:100vh} in styles.css),
      // WebKit can keep painting stale pixels on a standalone-PWA cold launch
      // until something forces a real repaint. This briefly toggles the viewport
      // meta tag's viewport-fit to force that.
      window.forceViewportRecalc = function () {
        var vp = document.querySelector('meta[name="viewport"]');
        if (!vp) return;
        var original = vp.getAttribute('content');
        vp.setAttribute('content', original.replace('viewport-fit=cover', 'viewport-fit=auto'));
        void document.documentElement.offsetHeight; // force sync reflow between the two steps
        setTimeout(function () { vp.setAttribute('content', original); }, 60);
      };

      if (window.isStandalonePWA) {
        document.documentElement.classList.add('is-standalone');
        window.forceViewportRecalc();
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') { window.forceViewportRecalc(); }
        });
      }
    })();
  </script>
